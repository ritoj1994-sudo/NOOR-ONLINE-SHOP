name: Build NOOR Godown Manager APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'godown-manager/**'
      - '.github/workflows/godown-manager-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: godown-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install packages
        run: npm install
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NOOR-GODOWN-MANAGER-APK
          path: godown-manager/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
